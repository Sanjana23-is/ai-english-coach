services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: englishcoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-englishcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-englishcoach_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-englishcoach_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englishcoach} -d ${POSTGRES_DB:-englishcoach_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
